[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excel2md"
version = "2.1.1"
description = "Excel to Markdown converter with CSV markdown output support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Elvez", email = "info@elvez.co.jp"}
]
keywords = ["excel", "markdown", "converter", "csv", "openpyxl", "xlsx", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/elvezjp/excel2md"
Repository = "https://github.com/elvezjp/excel2md"
Issues = "https://github.com/elvezjp/excel2md/issues"

[project.scripts]
excel2md = "excel2md.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["v2.1.1/excel2md"]

[tool.hatch.build.targets.sdist]
include = [
    "v2.1.1/excel2md/**",
    "README.md",
    "README_ja.md",
    "LICENSE",
    "CHANGELOG.md",
    "CHANGELOG_ja.md",
    "pyproject.toml",
]
exclude = [
    "v1.7/**",
    "v1.8/**",
    "v2.0/**",
    "v2.0.1/**",
    "v2.1.0/**",
    "docs/**",
    "v2.1.1/tests/**",
    "v2.1.1/spec*.md",
    "v2.1.1/verify_csv_markdown.py",
    "v2.1.1/excel_to_md.py",
]

[tool.pytest.ini_options]
testpaths = ["v2.1.1/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["v2.1.1"]
omit = ["v2.1.1/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
